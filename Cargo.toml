[package]
name = "sinn2"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-stm32 = { version = "0.6.0", features = ["stm32f411ve", "time-driver-any", "exti", "memory-x"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768"] }
defmt = "1.2.0"
defmt-rtt = "1.3.1"
panic-halt = "1.0.0"
cortex-m-rt = "0.7.7"
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
